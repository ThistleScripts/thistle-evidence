name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: thistle-evidence/html/dui/laptop

      - name: Build DUI
        run: bun run build
        working-directory: thistle-evidence/html/dui/laptop

      # [thistle-evidence] holds both resources, ready to drop into the server's resources folder
      - name: Bundle Files
        run: |
          out=./temp/[thistle-evidence]
          res=$out/thistle-evidence
          mkdir -p $res/html/dui/laptop
          cp ./thistle-evidence/{config.lua,permissions.lua,fxmanifest.lua,README.md} $res
          cp -r ./thistle-evidence/{client,common,data,locales,server,setup,stream} $res
          cp -r ./thistle-evidence/html/dui/scanner $res/html/dui
          cp -r ./thistle-evidence/html/dui/laptop/dist $res/html/dui/laptop
          cp -r ./thistle-lib $out/thistle-lib

          mkdir -p ./temp/item_images
          cp ./thistle-evidence/setup/images/* ./temp/item_images

          cd ./temp
          zip -r thistle-evidence.zip "./[thistle-evidence]"
          cd item_images && zip -r ../item_images.zip ./*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          make_latest: true
          files: |
            ./temp/thistle-evidence.zip
            ./temp/item_images.zip
