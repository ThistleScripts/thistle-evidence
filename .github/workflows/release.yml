name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: html/dui/laptop

      - name: Build DUI
        run: bun run build
        working-directory: html/dui/laptop
      
      - name: Bundle Files
        run: |
          mkdir -p ./temp/thistle-evidence
          mkdir -p ./temp/thistle-evidence/html
          mkdir -p ./temp/thistle-evidence/html/dui
          mkdir -p ./temp/thistle-evidence/html/dui/laptop
          cp ./{config.lua,fxmanifest.lua,LICENSE,README.md} ./temp/thistle-evidence
          cp -r ./{client,common,locales,server,setup} ./temp/thistle-evidence
          cp -r html/dui/scanner ./temp/thistle-evidence/html/dui
          cp -r html/dui/laptop/dist ./temp/thistle-evidence/html/dui/laptop

          mkdir -p ./temp/item_images
          cp ./setup/images/* ./temp/item_images

          cd ./temp
          zip -r thistle-evidence.zip ./thistle-evidence
          cd item_images && zip -r ../item_images.zip ./*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          make_latest: true
          files: |
            ./temp/thistle-evidence.zip
            ./temp/item_images.zip